[project]
name = "sequoia"
version = "0.2.0"
description = "Sequoia - Zeus log + Dify RAG + LangGraph"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.1",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
  "streamlit>=1.31.0",
  "langgraph>=0.2.0",
  "openai>=1.40.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { where = ["."], include = ["apps*", "jupiter_core*", "sequoia_core*"] } }

[tool.pytest.ini_options]
testpaths = ["apps/backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
