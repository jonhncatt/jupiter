services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      - JUPITER_BACKEND=http://backend:8000
    ports:
      - "8502:8501"
    depends_on:
      - backend
